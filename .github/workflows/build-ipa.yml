
name: Build Watermelon Unsigned IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned IPA
    runs-on: xcode-27
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Xcode and iOS SDK
        shell: bash
        run: |
          echo "Xcode version:"
          xcodebuild -version

          echo "iOS SDK version:"
          xcrun --sdk iphoneos --show-sdk-version

          echo "Runner architecture:"
          uname -m

      - name: Build Watermelon for iPhone
        shell: bash
        run: |
          echo "Building Watermelon..."

          xcodebuild \
            -quiet \
            -project Watermelon.xcodeproj \
            -scheme Watermelon \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1

          RESULT=$?

          if [ "$RESULT" -ne 0 ]; then
            echo "::group::Build errors"

            grep -n -i -E -A 4 -B 2 \
              'error:|fatal error|BUILD FAILED|failed to|SwiftCompile failed' \
              build.log | tail -100 || true

            echo "::endgroup::"

            echo "::error::Xcode build failed (exit $RESULT)"
            exit "$RESULT"
          fi

          echo "Build succeeded!"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Watermelon-Build-Log
          path: build.log
          retention-days: 7
          if-no-files-found: warn

      - name: Package unsigned IPA
        shell: bash
        run: |
          echo "Packaging Watermelon..."

          APP="build/Build/Products/Release-iphoneos/Watermelon.app"

          if [ ! -d "$APP" ]; then
            echo "::error::Watermelon.app not found"
            exit 1
          fi

          mkdir -p Payload
          cp -R "$APP" Payload/

          # Remove existing signatures
          find Payload -type d -name _CodeSignature \
            -prune -exec rm -rf {} +

          # Remove provisioning profiles
          find Payload -type f \
            -name embedded.mobileprovision -delete

          # Create IPA
          zip -qry Watermelon-unsigned.ipa Payload

          # Verify archive
          unzip -tq Watermelon-unsigned.ipa

          echo "IPA created successfully:"
          ls -lh Watermelon-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Watermelon-Unsigned-IPA
          path: Watermelon-unsigned.ipa
          retention-days: 30
          if-no-files-found: error
